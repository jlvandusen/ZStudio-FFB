; ZStudioFFBHost settings. Sits beside ZStudioFFBHost.exe. See ZStudioFFBHost/README.md.

[Settings]
; "" = the first force-feedback device; a number = that index from --list; text = a name substring ("G923").
Device=
; Upstream FFB Arcade Plugin semantics: the force range in percent. MinForce lifts weak events past a wheel's dead zone.
MinForce=0
MaxForce=80
; 1 = square-root curve: small events feel stronger.
PowerMode=0
; 1 = swap the left/right of jolts.
Reverse=0
; Device gain in percent, where the device supports it.
Gain=100
PollMs=10
Logging=1

[Streams]
; Every 2 s the host attaches to the most recently written file of these (so it follows whichever game is playing).
; %VARS% expand.
; SteamGameN = <steamapps\common folder>|<path inside the install>, looked for in EVERY Steam library on this PC.
; DEFY, the Steam game (writes <install>\artifacts\feeds\feedback.ndjson):
SteamGame1=DEFY|artifacts\feeds\feedback.ndjson
; DEFY, developer checkout (edit the root to yours):
Stream1=D:\repos\personal\DefyEngine\artifacts\feeds\feedback.ndjson
Stream2=C:\Users\%USERNAME%\repos\personal\DefyEngine\artifacts\feeds\feedback.ndjson

[Mapping]
; A v1 event's force = max(rumble*RumbleWeight, shake*ShakeWeight, trauma*TraumaWeight), then the Min/Max range.
RumbleWeight=1.0
ShakeWeight=0.8
TraumaWeight=0.6
JoltMs=160
SineMs=600
SinePeriodMs=70
RumbleMs=180
; Events weaker than this play nothing (UI ticks).
Floor=0.02

; ---- Per-id rules (DEFY ids). Type = jolt | sine | rumble | off. Force (0-100) replaces the computed strength,
; scaled by the event's distance scale; Gain multiplies it instead. A trailing * matches a prefix.

; Rolling, held forces: the ground moving.
[fb_quake]
Type=sine
LengthMs=1400
PeriodMs=90
[fb_tsunami_wall]
Type=sine
LengthMs=2200
PeriodMs=120
[fb_thunder_roll]
Type=sine
LengthMs=1600
PeriodMs=110
Gain=0.8
[fb_hazard_*]
Type=sine
LengthMs=900
[fb_tornado_near]
Type=sine
LengthMs=1200
PeriodMs=60
[fb_air_crash_fall]
Type=sine
LengthMs=700
PeriodMs=50

; Hard kicks.
[fb_shockwave_pass]
Type=jolt
LengthMs=260
Gain=1.2
[fb_superweapon_impact]
Type=jolt
LengthMs=420
Force=100
[fb_thunder_clap]
Type=jolt
LengthMs=140
[fb_stronghold_boom]
Type=jolt
LengthMs=320
[fb_collapse_impact]
Type=jolt
LengthMs=300
[fb_air_crash_impact]
Type=jolt
LengthMs=240

; Interface ticks a wheel should not feel.
[fb_selection]
Type=off
[fb_order_issued]
Type=off
[fb_order_invalid]
Type=off
[fb_building_placed]
Type=off
[fb_insufficient_funds]
Type=off
[fb_pip_coach]
Type=off
[fb_weapon_fired]
Type=off
