; ZStudioFFBHost settings. Sits beside ZStudioFFBHost.exe. See ZStudioFFBHost/README.md.

[Settings]
; "" = the first force-feedback device; a number = that index from --list; text = a name substring ("G923").
Device=
; Upstream FFB Arcade Plugin semantics: the force range in percent. MinForce lifts weak events past a wheel's dead zone.
MinForce=0
MaxForce=80
; 1 = square-root curve: small events feel stronger.
PowerMode=0
; 1 = swap the left/right of jolts.
Reverse=0
; Device gain in percent, where the device supports it.
Gain=100
PollMs=10
Logging=1

[Streams]
; Every 2 s the host attaches to the most recently written file of these (so it follows whichever game is playing).
; %VARS% expand.
; SteamGameN = <steamapps\common folder>|<path inside the install>, looked for in EVERY Steam library on this PC.
; DEFY, the Steam game (writes <install>\artifacts\feeds\feedback.ndjson):
SteamGame1=DEFY|artifacts\feeds\feedback.ndjson
; DEFY, developer checkout (edit the root to yours):
Stream1=D:\repos\personal\DefyEngine\artifacts\feeds\feedback.ndjson
Stream2=C:\Users\%USERNAME%\repos\personal\DefyEngine\artifacts\feeds\feedback.ndjson
; Nightmarch: The Wandering Tower (Steam app 5614420; the game writes <install>\artifacts\feeds\feedback.ndjson).
SteamGame2=Nightmarch|artifacts\feeds\feedback.ndjson
; Nightmarch, developer checkouts (DEV01 / the Surface):
Stream3=D:\repos\personal\Nightmarch\artifacts\feeds\feedback.ndjson
Stream4=C:\Users\%USERNAME%\repos\personal\Nightmarch\artifacts\feeds\feedback.ndjson

; ---- The board output (board.h): a physical game board's ESP32 props behind a bridge ESP32 on USB serial.
; Each prop has WS2812/SK6812 lights and a vibration motor on a PWM motor driver. Nightmarch puts a light and a motor
; shape on every line that should show on the board (terr, fx, rgb, motor, shape...); this host sends them as the
; board's wire protocol v1 LED and RUMBLE frames. Leave Port empty for no board. Test it: ZStudioFFBHost.exe --board-test
[Board]
; The bridge's COM port (Device Manager, "USB Serial" / "USB-Enhanced-SERIAL CH9102" / "CP210x"). Empty = no board.
Port=
; The bridge's NM_SERIAL_BAUD (Nightmarch/firmware/src/common/nm_board.h).
Baud=921600
; Percent. Brightness scales every colour sent; MotorScale every motor strength (a quieter table at night: 60).
Brightness=100
MotorScale=100
; The longest a motor may run per cue. The props' firmware clamps at 2500 on its own; this can only be lower.
MaxMotorMs=2500
; 1 = a game WITHOUT board fields (DEFY...) also shakes every prop's motor with the force it plays on the wheel.
ForceToMotor=0
; 0 turns the lights or the motors off without unplugging anything.
Lights=1
Motors=1

[Mapping]
; A v1 event's force = max(rumble*RumbleWeight, shake*ShakeWeight, trauma*TraumaWeight), then the Min/Max range.
RumbleWeight=1.0
ShakeWeight=0.8
TraumaWeight=0.6
JoltMs=160
SineMs=600
SinePeriodMs=70
RumbleMs=180
; Events weaker than this play nothing (UI ticks).
Floor=0.02

; ---- Per-id rules (DEFY ids). Type = jolt | sine | rumble | off. Force (0-100) replaces the computed strength,
; scaled by the event's distance scale; Gain multiplies it instead. A trailing * matches a prefix.

; Rolling, held forces: the ground moving.
